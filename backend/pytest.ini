[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    slow: needs a real local LLM (Ollama). Minutes per turn on CPU. Skips with
        an explicit reason when no model is available; run the full suite with
        `pytest` and a fast suite with `pytest -m "not slow"`.
    v102_real_model: V10.2 acceptance evidence that requires an actual model provider.
    v102_deterministic: V10.2 deterministic CORE/RUNTIME verification; never real-model evidence.
filterwarnings =
    ignore::DeprecationWarning

[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    slow: needs a real local LLM (Ollama). Minutes per turn on CPU. Skips with
        an explicit reason when no model is available; run the full suite with
        `pytest` and a fast suite with `pytest -m "not slow"`.
filterwarnings =
    ignore::DeprecationWarning

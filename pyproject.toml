[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zroq-core"
version = "0.2.6"
description = "ZORQ Phase 2.6 action-snapshot and execution-integrity closure"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.unittest]
# The project intentionally uses Python's standard-library unittest runner.